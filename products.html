<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse 142 small household appliance models from Yiwu Global Trade by category, product name, or model number.">
  <title>Wholesale Appliance Catalog | Yiwu Global Trade</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="products">
  <div id="site-header"></div>
  <main id="main-content">
    <section class="page-hero page-hero-products">
      <div class="container">
        <div class="page-hero-copy">
          <p class="eyebrow">Wholesale Catalog</p>
          <h1>Small Household Appliances</h1>
          <p>Search by model or browse nine catalog categories. Each product opens a dedicated inquiry page.</p>
        </div>
      </div>
    </section>
    <nav class="breadcrumbs" aria-label="Breadcrumb"><div class="container"><a href="index.html">Home</a> / Products</div></nav>
    <section class="section" id="catalog-results">
      <div class="container">
        <div class="catalog-toolbar">
          <label>
            <span class="eyebrow">Search the catalog</span>
            <input class="search-field" id="catalog-search" type="search" placeholder="Model, product, or category" autocomplete="off">
          </label>
          <p class="results-count" id="results-count" aria-live="polite"></p>
        </div>
        <div class="filter-tabs" id="filter-tabs" aria-label="Product categories"></div>
        <div class="product-grid" id="catalog-grid"></div>
        <nav class="pagination" id="pagination" aria-label="Catalog pages"></nav>
      </div>
    </section>
    <section class="cta-band">
      <div class="container cta-inner">
        <h2>Need a quotation for several models?</h2>
        <a class="button button-light" href="contact.html">Send Your Product List</a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/products.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
